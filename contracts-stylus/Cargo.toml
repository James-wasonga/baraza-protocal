[package]
name = "baraza-jury-selector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reputation-weighted commit-reveal jury selection for Baraza Protocol, compiled to WASM and deployed as an Arbitrum Stylus contract."

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = "0.7.6"
alloy-sol-types = "0.7.6"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]

[[bin]]
name = "baraza-jury-selector"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false
